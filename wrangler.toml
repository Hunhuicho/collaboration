# Cloudflare Pages project.
#
# Pages serves at <project>.pages.dev — two levels, no account subdomain.
# A Workers deploy would instead land on <worker>.<account>.workers.dev.
#
# `name` must match the Pages project name in the dashboard, and the project's
# deploy command must be `npx wrangler pages deploy public` (a plain
# `wrangler deploy` is the Workers command and fails against this config).

name = "collaboration-a43"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"
