<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>업무 검토 보드</title>
<meta name="description" content="공유 암호로 들어와 문서별 Y/N과 의견을 남기는 업무 검토 보드" />
<link rel="stylesheet" href="./assets/app.css" />
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="tb-id">
      <b>업무 검토 보드</b>
      <span class="sub"><span id="roomName">연결 중…</span></span>
    </div>
    <div class="tb-actions">
      <span class="sync off" id="syncBadge"><span class="dot"></span><span id="syncText">로컬 저장</span></span>
      <button class="btn" type="button" id="btnSwitch">암호 변경</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <div class="hero-eyebrow">
      <span class="code">REVIEW BOARD</span>
      <span class="pill blue">공유 암호 전용</span>
    </div>
    <h1>업무 검토 · 질의 보드</h1>
    <p class="sub">설계안이나 업무 조사 내용을 문서로 올리고, 항목마다 <b>Y / N</b>과 의견을 받습니다. 같은 암호를 쓰는 사람끼리 서로의 회신을 바로 볼 수 있습니다.</p>
  </header>

  <section class="section">
    <div class="sec-head">
      <div class="sec-num">문서</div>
      <div>
        <h2>검토 문서</h2>
        <p>문서를 열어 항목별로 회신해 주세요. 입력값은 자동 저장됩니다.</p>
      </div>
    </div>
    <div class="portal-grid" id="docGrid"></div>
  </section>

  <footer>
    <span class="code">REVIEW BOARD</span>
    <p>암호를 아는 사람은 이 공간의 모든 문서와 회신을 보고 쓸 수 있습니다. 대외비 자료는 올리지 마세요.</p>
  </footer>
</div>

<script src="./assets/firebase-config.js"></script>
<script src="./assets/board-core.js"></script>
<script>
/* 검토 문서 목록 — 문서를 추가하면 여기에 한 줄만 더합니다. */
window.BOARD_DOCS = [
  {
    id: "s04-procurement-status-flow",
    code: "MERP PROCUREMENT",
    title: "Procurement Status Flow Guide",
    desc: "PR → PO → DN → GR → IR 상태 흐름, 문서 간 정의 불일치, 취소(CN) 트리거, 반려 PR 재사용, 화면 표시안",
    items: 12,
    href: "./docs/s04-procurement-status-flow.html",
    tags: [["red", "첫 번째 논의 대상"], ["blue", "STATUS FLOW"]]
  },
  {
    id: "s04-purchase-progress-status",
    code: "MERP S04",
    title: "Purchase Progress Status Design",
    desc: "PR·PO 화면에 보여줄 단일 진행 상태 정의, 취소(CN) 트리거, 수정 정책, 상태 판정 규칙",
    items: 13,
    href: "./docs/s04-purchase-progress-status.html",
    tags: [["blue", "WORKING DRAFT"], ["amber", "검토 요청"]]
  }
];

(function () {
  "use strict";
  var B = window.Board, esc = B.esc;
  var grid = document.getElementById("docGrid");

  function card(d, count) {
    var tags = (d.tags || []).map(function (t) { return '<span class="pill ' + t[0] + '">' + esc(t[1]) + '</span>'; }).join("");
    return '<a class="doc-card" href="' + esc(d.href) + '">' +
      '<div class="top"><span class="code">' + esc(d.code) + '</span>' + tags + '</div>' +
      '<h3>' + esc(d.title) + '</h3>' +
      '<p>' + esc(d.desc) + '</p>' +
      '<div class="foot"><span>검토 항목 ' + d.items + '건</span><span id="cnt-' + esc(d.id) + '">' + (count == null ? "" : count + "명 회신") + '</span></div>' +
    '</a>';
  }

  function render(counts) {
    grid.innerHTML = window.BOARD_DOCS.map(function (d) {
      return card(d, counts ? counts[d.id] : null);
    }).join("");
  }

  function setSync(kind, text) {
    var badge = document.getElementById("syncBadge");
    badge.className = "sync " + kind;
    document.getElementById("syncText").textContent = text;
  }

  render(null);

  document.getElementById("btnSwitch").addEventListener("click", function () {
    B.leave();
    location.reload();
  });

  if (!B.hasConfig) {
    setSync("off", "로컬 저장");
    document.getElementById("roomName").textContent = "공유 저장 미설정 — 문서는 열람·작성 가능";
    document.getElementById("btnSwitch").hidden = true;
  } else {
    setSync("busy", "연결 중…");
    B.enter().then(function (room) {
      if (!room || !room.key) { setSync("off", "로컬 저장"); return; }
      setSync("on", "공유 저장 켜짐");
      document.getElementById("roomName").textContent = room.label ? ("공간: " + room.label) : "공유 공간 연결됨";
      var counts = {};
      return Promise.all(window.BOARD_DOCS.map(function (d) {
        return B.listAll(d.id).then(function (list) { counts[d.id] = list.length; }, function () {});
      })).then(function () { render(counts); });
    }).catch(function (err) {
      setSync("err", "연결 실패");
      document.getElementById("roomName").textContent = "연결 실패 — " + err.message;
    });
  }
})();
</script>
</body>
</html>
